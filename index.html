<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241A14" />

    <title>Buffet José do Carmo | Buffet para Eventos em Aguaí e Região</title>
    <meta
      name="description"
      content="Buffet self-service para casamentos, aniversários, festas e confraternizações em Aguaí–SP e região. Mesa farta, pratos quentes, saladas e atendimento próximo. Monte seu orçamento pelo WhatsApp."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Pré-carrega apenas a foto da primeira dobra (LCP). Se a foto principal
      mudar em src/data/siteContent.ts, atualize o nome do arquivo aqui.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/media/images/mesa-de-saladas-800.avif"
      imagesrcset="/media/images/mesa-de-saladas-480.avif 480w, /media/images/mesa-de-saladas-800.avif 800w, /media/images/mesa-de-saladas-1200.avif 1200w"
      imagesizes="(min-width: 900px) 46vw, 100vw"
      fetchpriority="high"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--%CANONICAL%-->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buffet José do Carmo" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Buffet José do Carmo | Buffet para eventos em Aguaí e região" />
    <meta
      property="og:description"
      content="Comida de verdade para reunir quem importa. Buffet self-service para casamentos, aniversários, festas e confraternizações em Aguaí–SP e região."
    />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mesa de saladas farta montada pelo Buffet José do Carmo em um evento"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Buffet José do Carmo",
        "description": "Buffet self-service para casamentos, aniversários, festas e confraternizações em Aguaí–SP e região.",
        "slogan": "Nossa família trabalhando para atender a sua.",
        "servesCuisine": "Brasileira",
        "telephone": "+55 19 99177-3857",
        "image": "%OG_IMAGE%",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Aguaí",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "areaServed": [
          { "@type": "City", "name": "Aguaí" },
          { "@type": "AdministrativeArea", "name": "Região de Aguaí – SP" }
        ],
        "potentialAction": {
          "@type": "CommunicateAction",
          "name": "Solicitar orçamento pelo WhatsApp",
          "target": "https://wa.me/5519991773857"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Buffet self-service para casamentos" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Buffet self-service para aniversários" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Buffet self-service para festas" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Buffet self-service para confraternizações" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
